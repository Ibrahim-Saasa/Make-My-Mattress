<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make My Mattress | Hindustan Mattress Co.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Base background, will be overridden by CSS variables */
      background-color: #FDFDFD;
    }

    h1,
    h2,
    h3,
    .brand-header {
      font-family: 'Manrope', sans-serif;
    }

    .bg-brand-navy {
      background-color: #09174A;
    }

    .text-brand-navy {
      color: #09174A;
    }

    .bg-brand-amber {
      background-color: #C8A55B;
    }

    .border-brand-amber {
      border-color: #C8A55B;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    /* Light Theme Defaults (CSS Variables) - ENHANCED PREMIUM SYSTEM */
    :root {
      --brand-primary: #1740D1;
      --brand-primary-strong: #1237B5;
      --brand-primary-deep: #09174A;
      --brand-gold: #C8A55B;
      --brand-gold-deep: #9A7A39;

      /* Backgrounds - Premium gradients and surfaces */
      --color-background: linear-gradient(180deg, #FAFBFF 0%, #F4F7FF 100%);
      --color-background-solid: #FAFBFF;
      --color-card-background: #FFFFFF;
      --color-card-background-hover: #F5F8FF;

      /* Text - Enhanced contrast and hierarchy */
      --color-text-primary: #09174A;
      --color-text-secondary: #3A4A78;
      --color-text-tertiary: #7382A8;
      --color-text-muted: #B5C0D8;

      /* Interactive colors */
      --color-primary: var(--brand-primary);
      --color-primary-hover: var(--brand-primary-strong);
      --color-secondary: var(--brand-primary-deep);
      --color-tertiary: #0A7D67;
      --color-accent: var(--brand-gold);

      /* Borders and dividers */
      --color-border: #DCE3F3;
      --color-border-focus: var(--brand-primary);

      /* Inputs and forms */
      --color-input-bg: #F6F8FE;
      --color-input-border: #C7D2EA;
      --color-input-border-focus: var(--brand-primary);

      /* Shadows - Premium depth system */
      --color-shadow-light: rgba(9, 23, 74, 0.05);
      --color-shadow-medium: rgba(9, 23, 74, 0.09);
      --color-shadow-strong: rgba(9, 23, 74, 0.14);
      --color-shadow-xl: rgba(9, 23, 74, 0.18);

      /* Status colors */
      --color-success: #0A7D67;
      --color-warning: var(--brand-gold);
      --color-error: #C25158;
      --color-info: var(--brand-primary);
    }

    /* Dark Theme Overrides (CSS Variables) - ENHANCED PREMIUM SYSTEM */
    html.dark {
      --color-background: linear-gradient(180deg, #0A1330 0%, #0E1A3F 58%, #14265C 100%);
      --color-background-solid: #0A1330;
      --color-card-background: #152348;
      --color-card-background-hover: #1B2B56;

      --color-text-primary: #F8FBFF;
      --color-text-secondary: #D7DFFD;
      --color-text-tertiary: #A8B8EC;
      --color-text-muted: #7286C0;

      /* Interactive colors (brighter in dark mode) */
      --color-primary: #4C72FF;
      --color-primary-hover: #6B8BFF;
      --color-secondary: #DDE6FF;
      --color-tertiary: #39C9A8;
      --color-accent: #D8B56C;

      --color-border: #304578;
      --color-border-focus: #7D98FF;

      --color-input-bg: #1A274D;
      --color-input-border: #4562A8;
      --color-input-border-focus: #7D98FF;

      --color-shadow-light: rgba(0, 0, 0, 0.22);
      --color-shadow-medium: rgba(0, 0, 0, 0.28);
      --color-shadow-strong: rgba(0, 0, 0, 0.34);
      --color-shadow-xl: rgba(0, 0, 0, 0.42);

      --color-success: #39C9A8;
      --color-warning: #D8B56C;
      --color-error: #D76A72;
      --color-info: #6B8BFF;

      /* Moonlight Glow and Faint Stars */
      background-image:
        /* Moonlight glow from corners */
        radial-gradient(circle 800px at top left, rgba(76, 114, 255, 0.12), transparent),
        radial-gradient(circle 800px at bottom right, rgba(23, 64, 209, 0.14), transparent),
        /* Faint stars - multiple small radial gradients */
        radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 80% 40%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 50% 90%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 70% 10%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 20% 50%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 90% 60%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 40% 30%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 60% 80%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 5% 95%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 95% 5%, rgba(255, 255, 255, 0.3), transparent);
      background-attachment: fixed;
      /* Keep stars fixed when scrolling */
    }

    /* Apply CSS variables to Tailwind-like classes */
    .bg-theme-background {
      background-color: var(--color-background);
    }

    .bg-theme-card {
      background-color: var(--color-card-background);
    }

    .hover\\:bg-theme-card-hover:hover {
      background-color: var(--color-card-background-hover);
    }

    .text-theme-primary {
      color: var(--color-text-primary);
    }

    .text-theme-secondary {
      color: var(--color-text-secondary);
    }

    .text-theme-tertiary {
      color: var(--color-text-tertiary);
    }

    .border-theme-border {
      border-color: var(--color-border);
    }

    .bg-theme-input {
      background-color: var(--color-input-bg);
    }

    .border-theme-input {
      border-color: var(--color-input-border);
    }

    .shadow-theme-light {
      box-shadow: 0 1px 2px var(--color-shadow-light);
    }

    .shadow-theme-medium {
      box-shadow: 0 4px 6px var(--color-shadow-medium);
    }

    .shadow-theme-strong {
      box-shadow: 0 10px 15px var(--color-shadow-strong);
    }

    .shadow-theme-xl {
      box-shadow: 0 20px 25px -5px var(--color-shadow-strong), 0 8px 10px -6px var(--color-shadow-medium);
    }

    .shadow-theme-2xl {
      box-shadow: 0 25px 50px -12px var(--color-shadow-strong);
    }

    .shadow-theme-3xl {
      box-shadow: 0 35px 60px -15px var(--color-shadow-strong);
    }
  </style>
</head>

<body class="bg-theme-background text-theme-primary antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
